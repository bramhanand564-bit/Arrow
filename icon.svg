<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="arrowGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="arrowCyan" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- Subtle Grid Dots -->
  <g fill="rgba(255,255,255,0.14)">
    <circle cx="112" cy="112" r="7"/><circle cx="208" cy="112" r="7"/><circle cx="304" cy="112" r="7"/><circle cx="400" cy="112" r="7"/>
    <circle cx="112" cy="208" r="7"/><circle cx="208" cy="208" r="7"/><circle cx="304" cy="208" r="7"/><circle cx="400" cy="208" r="7"/>
    <circle cx="112" cy="304" r="7"/><circle cx="208" cy="304" r="7"/><circle cx="304" cy="304" r="7"/><circle cx="400" cy="304" r="7"/>
    <circle cx="112" cy="400" r="7"/><circle cx="208" cy="400" r="7"/><circle cx="304" cy="400" r="7"/><circle cx="400" cy="400" r="7"/>
  </g>

  <!-- Bent Cyan Arrow -->
  <path d="M120 356 L120 208 L264 208" fill="none" stroke="url(#arrowCyan)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <polygon points="322,208 242,158 258,208 242,258" fill="#67e8f9" filter="url(#glow)"/>

  <!-- Bent Gold Arrow -->
  <path d="M392 148 L392 316 L248 316" fill="none" stroke="url(#arrowGold)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <polygon points="188,316 268,266 252,316 268,366" fill="#fef08a" filter="url(#glow)"/>
</svg>
